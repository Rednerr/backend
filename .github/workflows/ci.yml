on:
  push:
    branches: [ "main" ]

jobs:
  test_and_build:
    # GitHub использует полноценную виртуальную машину
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    # 3. Запуск тестов (Аналог задачи unit-test)
    - name: test
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pytest

    # 4. Сборка
    - name: Create ZIP archive
      run: zip archive.zip main.py

    # 5. Сохранение артефактов (Аналог artifacts: paths:)
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-archive
        path: archive.zip